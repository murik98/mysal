name: Connect to VPS
on:
  push:
    branches: [ "main" ]
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: 'zdTEPMqLXV93'
      - name: Connect and test VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p 22 root@ydp.tejribe.online "whoami && hostname && uptime"
