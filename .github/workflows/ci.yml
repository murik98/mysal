name: Deploy and Start Django

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS and Fix Bind Address
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            PROJECT_DIR="$HOME/mysal"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              rm -rf "$PROJECT_DIR"
              git clone https://github.com/murik98/mysal.git "$PROJECT_DIR"
            else
              cd "$PROJECT_DIR"
              git pull origin main
            fi

            cd "$PROJECT_DIR/neoc_project"

            # Настраиваем venv и зависимости
            if [ ! -d "env" ]; then
              python3 -m venv env
            fi
            ./env/bin/pip install --upgrade pip
            if [ -f "requirements.txt" ]; then
              ./env/bin/pip install -r requirements.txt
            else
              ./env/bin/pip install django
            fi

            # Пересоздаем службу systemd с жесткой привязкой к 0.0.0.0:2255
            cat << EOF > /etc/systemd/system/django_neoc.service
            [Unit]
            Description=Django neoc_project on port 2255
            After=network.target

            [Service]
            User=root
            WorkingDirectory=$PROJECT_DIR/neoc_project
            ExecStart=$PROJECT_DIR/neoc_project/env/bin/python manage.py runserver 0.0.0.0:2255
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            # Открываем порт в брандмауэре
            ufw allow 2255 || true
            iptables -A INPUT -p tcp --dport 2255 -j ACCEPT || true

            systemctl daemon-reload
            systemctl enable django_neoc
            ./env/bin/python manage.py migrate
            systemctl restart django_neoc
            sleep 3
            systemctl status django_neoc --no-pager
