name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Connect and run git pull
        run: |
          sshpass -p "zdTEPMqLXV93" ssh -o StrictHostKeyChecking=no -p 22 root@sapak.ydp.online << 'EOF'
            cd ~/neoc_project/
            git pull origin main
          EOF
