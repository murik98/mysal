name: Connect to VPS without Secrets

on:
  push:
    branches: [ "main" ]

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Connect and run git pull
        run: |
          sshpass -p "zdTEPMqLXV93" ssh -o StrictHostKeyChecking=no -p 22 root@ydp.tejribe.online << 'EOF'
            cd .
            git pull origin main
          EOF
