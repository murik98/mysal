name: Deploy Django to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull updates and restart Django
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /root/mysal/
            git pull origin main
            /root/mysal/neoc_project/venv/bin/python /root/mysal/neoc_project/manage.py migrate
            systemctl restart django_neoc
