name: Deploy and Start Django

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone or pull code and start Django
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            PROJECT_DIR="$HOME/mysal"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              rm -rf "$PROJECT_DIR"
              git clone https://github.com/murik98/mysal.git "$PROJECT_DIR"
            else
              cd "$PROJECT_DIR"
              git pull origin main
            fi

            rm -rf "$PROJECT_DIR/neoc_project/env"

            cat << EOF > /etc/systemd/system/django_neoc.service
            [Unit]
            Description=Django neoc_project on port 2255
            After=network.target

            [Service]
            User=root
            WorkingDirectory=$PROJECT_DIR/neoc_project
            ExecStart=/usr/bin/python3 manage.py runserver 0.0.0.0:2255
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            ufw allow 2255 || true
            systemctl daemon-reload
            systemctl enable django_neoc
            python3 "$PROJECT_DIR/neoc_project/manage.py" migrate
            systemctl restart django_neoc
            sleep 2
            systemctl is-active django_neoc
